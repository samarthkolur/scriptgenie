# Secret scanning configuration.
#
# Extends the gitleaks default rule set with rules for the credential formats
# this project actually handles. The defaults do not cover them:
#
#   - `sk-` followed by 32 hex characters is the shape of the key that was
#     found in this repository's working directory during Stage 0.1 and is not
#     matched by any default rule.
#   - Groq (`gsk_`) and Supabase (`sbp_`, service-role JWT) credentials have no
#     default rules at all, and they are the two providers this system uses.

[extend]
useDefault = true

[[rules]]
id = "groq-api-key"
description = "Groq API key"
regex = '''\bgsk_[A-Za-z0-9]{48,64}\b'''
keywords = ["gsk_"]
tags = ["key", "groq"]

[[rules]]
id = "openai-compatible-secret-key"
description = "OpenAI-compatible secret key (sk- prefix)"
regex = '''\bsk-(?:proj-|ant-|or-)?[A-Za-z0-9_\-]{20,120}\b'''
keywords = ["sk-"]
tags = ["key"]

[[rules]]
id = "supabase-personal-access-token"
description = "Supabase personal access token"
regex = '''\bsbp_[a-f0-9]{40,}\b'''
keywords = ["sbp_"]
tags = ["token", "supabase"]

[[rules]]
id = "supabase-service-role-key"
description = "Supabase service-role JWT (must never leave the backend)"
regex = '''\beyJ[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{40,}\.[A-Za-z0-9_\-]{20,}\b'''
keywords = ["eyJ"]
tags = ["key", "supabase", "jwt"]

[allowlist]
description = "Paths and values that are not credentials"
paths = [
  '''pnpm-lock\.yaml''',
  '''uv\.lock''',
  '''\.gitleaks\.toml''',
  '''(^|/)node_modules/''',
  '''(^|/)\.venv/''',
  '''(^|/)\.next/''',
  # A local `.env` is where a working credential is *supposed* to be, and
  # `.gitignore` already stops git from committing one. Without this entry the
  # working-tree pass (`gitleaks detect --no-git`, which walks the filesystem
  # and does not consult `.gitignore`) fails on every developer machine that
  # has a filled-in `.env` — a gate that always fails is a gate people stop
  # reading, which costs more than it protects.
  #
  # This does not create a hole. "A `.env` must never be tracked" is owned by
  # `scripts/env-guard.sh`, which fails on the file being tracked at all
  # regardless of its contents, and which runs in `security.yml` and in the
  # pre-push hook. A secret pasted into any file git is not ignoring is still
  # caught here.
  #
  # Enumerated rather than written as `\.env(\..*)?$`, which would also match
  # the committed `.env.example` files. Those must stay visible to gitleaks: a
  # real value in an example file is the most common way a working key reaches
  # a public repository. Go's RE2 has no negative lookahead, so the ignored
  # names are listed instead — mirroring `.gitignore`, which ignores `.env`
  # and `.env.*` while re-including `*.example`.
  #
  # An unusual name such as `.env.staging` is deliberately not listed. It will
  # be reported, which is the safe direction to fail in; add it here when it
  # is added to `.gitignore`.
  '''(^|/)\.env$''',
  '''(^|/)\.env\.local$''',
  '''(^|/)\.env\.(development|test|production)(\.local)?$''',
]
regexTarget = "match"
regexes = [
  # Placeholder values in committed example files carry no secret.
  '''sk-your-key-here''',
  '''gsk_your-key-here''',
  '''<[A-Za-z0-9_\-]+>''',
]
