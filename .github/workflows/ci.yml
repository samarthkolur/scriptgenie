name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # pnpm 11 requires Node 22.13 or newer; anything lower fails in setup-node.
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate commits in this pull request
        if: github.event_name == 'pull_request'
        run: >
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

      # Dependabot titles carry no sign-off trailer, so the commitlint ignore
      # predicate cannot reach them; a grouped update's title exceeds 72
      # characters and Dependabot cannot be configured to shorten it.
      - name: Validate pull request title
        if: >
          github.event_name == 'pull_request'
          && github.event.pull_request.user.login != 'dependabot[bot]'
        run: echo "${{ github.event.pull_request.title }}" | pnpm exec commitlint

      - name: Reject AI-agent attribution in commit messages
        if: github.event_name == 'pull_request'
        run: bash scripts/check-authorship.sh
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"

  no-placeholders:
    name: No placeholders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/no-placeholders.sh

  database:
    name: Database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scriptgenie_test
        ports:
          - 5432:5432
        # The service container is only usable once it answers; without this the
        # first migration races the database's own initialisation.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      # Migrations must be proved against an empty database, not against one
      # that already has them. DATABASE_URL points at the service container, so
      # the script's docker path is not used here.
      - name: Apply migrations and run row level security tests
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/scriptgenie_test
        run: bash scripts/db-test.sh

  contract:
    name: API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - run: pnpm install --frozen-lockfile
      - run: cd apps/api && uv sync --frozen

      # openapi.json and apps/web/types/api.ts are generated and committed.
      # This fails when a route changed and they were not regenerated, which is
      # the case where the web app compiles happily against types the server no
      # longer honours.
      - name: Contract is not stale
        run: pnpm codegen:check

  ui-primitives:
    name: UI primitives unmodified
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          # The guard diffs against the merge base, which needs both sides of
          # the history rather than the single commit a shallow clone gives.
          fetch-depth: 0

      - name: shadcn primitives were not edited
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/check-ui-primitives.sh

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm --filter @scriptgenie/web test -- --coverage

      - name: Build
        run: pnpm build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-coverage
          path: apps/web/coverage/
          if-no-files-found: ignore
          retention-days: 7

  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Typecheck
        run: uv run mypy app

      - name: Test
        run: uv run pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-coverage
          path: apps/api/coverage.xml
          if-no-files-found: ignore
          retention-days: 7
